name: build

on:
  push:
  pull_request:
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        macos:
          - latest
          - 15
        xcode:
          - latest-stable
    runs-on: macos-${{ matrix.macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: |
          xcodebuild -scheme "Euclid" -sdk macosx clean build test -enableCodeCoverage YES -derivedDataPath Build/ -resultBundlePath Build/TestResults.xcresult
          cd Build/Build/ProfileData
          cd $(ls -d */|head -n 1)
          directory=${PWD##*/}
          pathCoverage=Build/Build/ProfileData/${directory}/Coverage.profdata
          cd ../../../../
          xcrun llvm-cov export -format="lcov" -instr-profile $pathCoverage Build/Build/Products/Debug/Euclid.framework/Euclid > info.lcov
      - name: Report test failures
        if: failure()
        run: |
          if [ -d Build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path Build/TestResults.xcresult
          fi
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-${{ matrix.macos }}
          path: Build/TestResults.xcresult
          if-no-files-found: ignore
      - name: Codecov
        uses: codecov/codecov-action@v3
        with:
          # the token is optional for a public repo, but including it anyway
          token: 2abe208f-c7d5-4c0d-aaf7-fa6994f1a78e
          env_vars: MD_APPLE_SDK_ROOT,RUNNER_OS,RUNNER_ARCH

  linux:
    strategy:
      fail-fast: false
      matrix:
        swiftver:
          - swift:5.10
          - swiftlang/swift:nightly-main
        swiftos:
          - focal
    runs-on: ubuntu-latest
    container:
      image: ${{ format('{0}-{1}', matrix.swiftver, matrix.swiftos) }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: swift test --enable-test-discovery

  swiftwasm_test:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v3
      - name: Setup SwiftWasm
        id: setup-swiftwasm
        uses: swiftwasm/setup-swiftwasm@v2
      - name: Build Tests
        run: swift build --build-tests --swift-sdk ${{ steps.setup-swiftwasm.outputs['swift-sdk-id'] }}
