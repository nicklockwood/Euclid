name: build

on:
  push:
  pull_request:
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        macos:
          - latest
          - 15
        xcode:
          - latest-stable
    runs-on: macos-${{ matrix.macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: |
          xcodebuild -scheme "Euclid" -sdk macosx clean build test -enableCodeCoverage YES -derivedDataPath Build/ -resultBundlePath Build/TestResults.xcresult
          cd Build/Build/ProfileData
          cd $(ls -d */|head -n 1)
          directory=${PWD##*/}
          pathCoverage=Build/Build/ProfileData/${directory}/Coverage.profdata
          cd ../../../../
          xcrun llvm-cov export -format="lcov" -instr-profile $pathCoverage Build/Build/Products/Debug/Euclid.framework/Euclid > info.lcov
      - name: Report test failures
        if: failure()
        run: |
          if [ -d Build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path Build/TestResults.xcresult
          fi
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-${{ matrix.macos }}
          path: Build/TestResults.xcresult
          if-no-files-found: ignore
      - name: Codecov
        uses: codecov/codecov-action@v3
        with:
          # the token is optional for a public repo, but including it anyway
          token: 2abe208f-c7d5-4c0d-aaf7-fa6994f1a78e
          env_vars: MD_APPLE_SDK_ROOT,RUNNER_OS,RUNNER_ARCH

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Select iOS simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, group in devices.items() if ".iOS-" in runtime
                    for d in group if d["name"].startswith("iPhone")]
          if not phones:
              sys.exit("No available iPhone simulator")
          print(phones[0]["udid"])
          ')
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
      - name: Test color import and export
        run: |
          xcodebuild -scheme Euclid -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath Build/ -resultBundlePath Build/ColorTests.xcresult \
            -only-testing:EuclidTests/ColorImportExportRegressionTests \
            -only-testing:EuclidTests/ModelIOImportTests \
            -only-testing:EuclidTests/ModelIOExportTests \
            -only-testing:EuclidTests/OBJOpacityTests \
            -only-testing:EuclidTests/PLYImportTests \
            -only-testing:EuclidTests/PLYExportTests test
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: color-test-results-ios
          path: Build/ColorTests.xcresult
          if-no-files-found: ignore

  linux:
    strategy:
      fail-fast: false
      matrix:
        swiftver:
          - swift:5.10
          - swiftlang/swift:nightly-main
        swiftos:
          - focal
    runs-on: ubuntu-latest
    container:
      image: ${{ format('{0}-{1}', matrix.swiftver, matrix.swiftos) }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: swift test --enable-test-discovery

  swiftwasm_test:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v3
      - name: Setup SwiftWasm
        id: setup-swiftwasm
        uses: swiftwasm/setup-swiftwasm@v2
      - name: Build Tests
        run: swift build --build-tests --swift-sdk ${{ steps.setup-swiftwasm.outputs['swift-sdk-id'] }}
